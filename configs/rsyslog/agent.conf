# 로그 송신 서버(에이전트) rsyslog 설정 — /etc/rsyslog.d/ 아래에 두고 사용
# 각 서비스의 로그 파일을 imfile로 읽어 C&C 수신 서버(center.conf)로 전달합니다.

# 파일 단위 로그를 읽기 위한 모듈 로드
module(load="imfile")

# MariaDB 감사 로그 감시 및 전송
input(type="imfile"
      File="/var/log/mariadb/mariadb-audit.log"
      Tag="mariadb-audit"
      Severity="info"
      Facility="local0")

# Nginx 접근 로그 감시 및 전송
input(type="imfile"
      File="/var/log/nginx/access.log"
      Tag="nginx-access"
      Severity="info"
      Facility="local0")

# Auditd 로그 파일 감시 설정
input(type="imfile"
      File="/var/log/audit/audit.log"
      Tag="audit"
      Severity="info"
      Facility="local0")

# ModSecurity 방화벽 로그 감시 설정
input(type="imfile"
      File="/var/log/httpd/modsec_audit.log" # 또는 /var/log/nginx/modsec_audit.log
      Tag="modsec"
      Severity="info"
      Facility="local0")

# DNS Query 로그 감시 설정
input(type="imfile"
      File="/var/log/named/query.log"
      Tag="named"
      Severity="info"
      Facility="local0")

# 읽어들인 파일 로그를 중앙 로그 서버(C&C)로 포워딩
# (@ = UDP 전송, @@ = TCP 전송)
local0.* @<C&C 서버 IP>:514
